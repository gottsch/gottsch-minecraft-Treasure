pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'GTNH Maven (RetroFuturaGradle)'
            url = 'https://nexus.gtnewhorizons.com/repository/public/'
        }
    }
}

plugins {
    // auto-provisions the Java 8 toolchain used to compile
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'Treasure2'
